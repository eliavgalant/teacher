<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tech It Easy — ספריית פעילויות למדריך</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:Arial,"Segoe UI",sans-serif;
      background:#07101f;color:#fff;padding:24px;
    }
    .wrap{width:min(920px,100%);text-align:center}
    .badge{
      display:inline-block;margin-bottom:14px;padding:7px 13px;border-radius:999px;
      border:1px solid #2e4d78;background:#0d1930;color:#31e8ff;font-weight:700
    }
    h1{margin:0 0 10px;font-size:clamp(34px,5vw,58px)}
    p{margin:0 0 34px;color:#b9c8df;font-size:18px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
    .card{
      min-height:220px;border:1px solid #2e4d78;border-radius:22px;
      background:#0d1930;color:#fff;text-decoration:none;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:12px;padding:30px;transition:.2s ease;
    }
    .card:hover{
      transform:translateY(-6px) scale(1.02);
      border-color:#31e8ff;
      box-shadow:0 16px 40px rgba(49,232,255,.18);
      background:#10213f;
    }
    .icon{font-size:52px}
    .card strong{font-size:26px}
    .card span{color:#aebfda;font-size:15px;line-height:1.5}
    @media(max-width:650px){.grid{grid-template-columns:1fr}.card{min-height:180px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="badge">Tech It Easy</div>
    <h1>ספריית פעילויות למדריך</h1>
    <p>בחרו פעילות כדי להיכנס למסך ההפעלה שלה</p>

    <div class="grid">
      <a class="card" href="./pick-the-pic/">
        <div class="icon">🖼️</div>
        <strong>Pick the Pic</strong>
        <span>כניסה לתפריט הפעילות: מצגת מורה ופעילות תלמידים</span>
      </a>

      <a class="card" href="./ai-race/">
        <div class="icon">🏁</div>
        <strong>AI-Race</strong>
        <span>פעילות מורה: מצגת, טריוויה וסיכום</span>
      </a>
    </div>
  </main>
</body>
</html>
