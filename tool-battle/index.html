<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="activity-status" content="editing">
  <title>קרב הכלים — בחירת תצוגה</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,"Segoe UI",sans-serif;background:#07101f;color:#fff;padding:24px}
    .wrap{width:min(980px,100%);text-align:center}
    h1{margin:0 0 10px;font-size:clamp(32px,5vw,52px)}
    p{margin:0 0 34px;color:#b9c8df;font-size:18px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
    .card{min-height:190px;border:1px solid #2e4d78;border-radius:22px;background:#0d1930;color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;transition:.2s ease}
    .card:hover{transform:translateY(-6px) scale(1.02);border-color:#31e8ff;box-shadow:0 16px 40px rgba(49,232,255,.18);background:#10213f}
    .icon{font-size:46px}
    .card strong{font-size:24px}
    .card span{color:#aebfda;font-size:15px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>⚔️ קרב הכלים</h1>
    <p>טורניר השוואה: Claude מול Gemini מול ChatGPT. בחרו לאיזו גרסה להיכנס</p>
    <div class="grid">
      <a class="card" href="presentation.html">
        <div class="icon">🧑‍🏫</div>
        <strong>מצגת מורה</strong>
        <span>הזירה, הסבבים ולוח התוצאות</span>
      </a>
      <a class="card" href="guide.html">
        <div class="icon">📋</div>
        <strong>מערך / הנחיות למדריך</strong>
        <span>מהלך השיעור, זמנים ודגשים</span>
      </a>
    </div>
  </main>
</body>
</html>
